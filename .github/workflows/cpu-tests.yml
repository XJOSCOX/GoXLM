name: Synthetic CPU tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  synthetic-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CUDA_VISIBLE_DEVICES: ''
      GOXLM_TEST_DEVICE: cpu
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install the CPU build of PyTorch
        run: python -m pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install inference API dependencies
        run: python -m pip install -r goxlm_web/requirements.txt
      - name: Run synthetic tests
        run: |
          python -c 'import torch; assert torch.version.cuda is None'
          python -B test_model.py
          python -B -m unittest -v training.test_train goxlm_v02.test_v02 goxlm_v02.test_governance goxlm_review.test_pilot goxlm_web.test_web

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.3'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
